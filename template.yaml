AWSTemplateFormatVersion: "2010-09-09"
Description: NFL Pick'em picks (Thursday + Sunday) and fantasy start/sit lineup (Thursday + Saturday + Sunday) emails, regular season only.

Parameters:
  RecipientEmail:
    Type: String
    Default: vinod.saravana@gmail.com
  SenderEmail:
    Type: String
    Default: vinod.saravana@gmail.com
    Description: Must be verified in SES (this stack creates the identity; click the link AWS emails you).
  CreateSenderIdentity:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set false if the sender address is already a verified SES identity in this region.
  UseAI:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: false = free spread-based picks, no Bedrock calls.
  ModelId:
    Type: String
    AllowedValues:
      - us.anthropic.claude-opus-4-6-v1
    Default: us.anthropic.claude-opus-4-6-v1
    Description: Bedrock inference profile; the account has a model agreement for this one.
  Effort:
    Type: String
    AllowedValues: [low, medium, high]
    Default: medium
  ThursdaySchedule:
    Type: String
    Default: cron(0 8 ? * THU *)
    Description: Central time. Thursday game only.
  SundaySchedule:
    Type: String
    Default: cron(0 6 ? * SUN *)
    Description: Central time. All remaining games (Sunday + Monday). 6am beats the 8:30am CT London kickoffs.
  LeagueId:
    Type: String
    Default: "410405345"
    Description: ESPN fantasy league ID. espn_s2/SWID cookies go in SSM /nfl-pickem/espn-s2 and /nfl-pickem/espn-swid.
  TeamId:
    Type: String
    Default: ""
    Description: ESPN fantasy team ID. Empty = the team owned by the SWID.
  LineupUseAI:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: true = Claude reviews close start/sit calls; false = ESPN projections only.
  ThursdayLineupSchedule:
    Type: String
    Default: cron(0 8 ? * THU *)
    Description: Central time. Start/sit for Thursday-game players.
  SaturdayLineupSchedule:
    Type: String
    Default: cron(0 9 ? * SAT *)
    Description: Central time. Full lineup preview after Friday injury reports.
  SundayLineupSchedule:
    Type: String
    Default: cron(45 10 ? * SUN *)
    Description: Central time. Final lineup, after noon-game inactives are out.
  AlertThursdaySchedule:
    Type: String
    Default: cron(0 18 ? * THU *)
    Description: Central time. Thursday night game (7:15 CT kickoff; inactives are out about 90 minutes before).
  AlertSundayMorningSchedule:
    Type: String
    Default: cron(15 6 ? * SUN *)
    Description: Central time. International morning games (7:30 CT kickoff).
  AlertSundayAfternoonSchedule:
    Type: String
    Default: cron(0 14 ? * SUN *)
    Description: Central time. Late-window games.
  AlertSundayNightSchedule:
    Type: String
    Default: cron(0 18 ? * SUN *)
    Description: Central time. Sunday night game (7:20 CT kickoff).
  AlertMondaySchedule:
    Type: String
    Default: cron(30 17 ? * MON *)
    Description: Central time. Monday night game.
  WaiverSchedule:
    Type: String
    Default: cron(0 8 ? * TUE *)
    Description: Central time. Free-agent/waiver pickups ahead of the Wednesday waiver run; emails only if there are any.

Conditions:
  MakeSenderIdentity: !Equals [!Ref CreateSenderIdentity, "true"]
  RecipientDiffers: !Not [!Equals [!Ref RecipientEmail, !Ref SenderEmail]]
  MakeRecipientIdentity: !And [!Condition MakeSenderIdentity, !Condition RecipientDiffers]

Resources:
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: MakeSenderIdentity
    Properties:
      EmailIdentity: !Ref SenderEmail

  # SES sandbox accounts can only send to verified addresses.
  RecipientIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: MakeRecipientIdentity
    Properties:
      EmailIdentity: !Ref RecipientEmail

  # FunctionRole and SchedulerRole are auto-named; deploy-role.yaml scopes the GitHub deploy role to those name patterns.
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: pickem
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-*
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ComedTopic
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nfl-pickem/*
              # Weekly pruning of the per-week records only; never the cookies, API key, results or heartbeats.
              - Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:DeleteParameters]
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nfl-pickem/locked
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nfl-pickem/locked/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nfl-pickem/picks
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nfl-pickem/picks/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nfl-pickem/alerts
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nfl-pickem/alerts/*

  PickemFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: nfl-pickem
      Runtime: python3.14
      Architectures: [arm64]
      Handler: app.handler
      Code: build/
      Role: !GetAtt FunctionRole.Arn
      Timeout: 600
      MemorySize: 512
      Environment:
        Variables:
          RECIPIENT_EMAIL: !Ref RecipientEmail
          SENDER_EMAIL: !Ref SenderEmail
          USE_AI: !Ref UseAI
          MODEL_ID: !Ref ModelId
          EFFORT: !Ref Effort
          STATE_PARAM_PREFIX: /nfl-pickem/locked
          ODDS_API_KEY_PARAM: /nfl-pickem/odds-api-key
          FAILURE_TOPIC_ARN: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ComedTopic

  # No async retries: a failed run already emails the failure alert, and a retry would repeat it (and a Thursday send).
  PickemInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref PickemFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/nfl-pickem
      RetentionInDays: 30

  LineupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: nfl-fantasy-lineup
      Runtime: python3.14
      Architectures: [arm64]
      Handler: lineup.handler
      Code: build/
      Role: !GetAtt FunctionRole.Arn
      Timeout: 600
      MemorySize: 512
      Environment:
        Variables:
          RECIPIENT_EMAIL: !Ref RecipientEmail
          SENDER_EMAIL: !Ref SenderEmail
          MODEL_ID: !Ref ModelId
          EFFORT: !Ref Effort
          LEAGUE_ID: !Ref LeagueId
          TEAM_ID: !Ref TeamId
          LINEUP_USE_AI: !Ref LineupUseAI
          ESPN_S2_PARAM: /nfl-pickem/espn-s2
          ESPN_SWID_PARAM: /nfl-pickem/espn-swid
          FAILURE_TOPIC_ARN: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ComedTopic

  LineupLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/nfl-fantasy-lineup
      RetentionInDays: 30

  # Emails when a run never finished (timeout, out of memory, no invoke), which the handlers can't report themselves.
  WatchdogFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: nfl-watchdog
      Runtime: python3.14
      Architectures: [arm64]
      Handler: watchdog.handler
      Code: build/
      Role: !GetAtt FunctionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          FAILURE_TOPIC_ARN: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:ComedTopic

  WatchdogLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/nfl-watchdog
      RetentionInDays: 30

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt PickemFunction.Arn
                  - !GetAtt LineupFunction.Arn
                  - !GetAtt WatchdogFunction.Arn

  ThursdayRun:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-pickem-thursday
      ScheduleExpression: !Ref ThursdaySchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt PickemFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "thursday"}'

  SundayRun:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-pickem-sunday
      ScheduleExpression: !Ref SundaySchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt PickemFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "sunday"}'

  ThursdayLineup:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-fantasy-lineup-thursday
      ScheduleExpression: !Ref ThursdayLineupSchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt LineupFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "thursday"}'

  SaturdayLineup:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-fantasy-lineup-saturday
      ScheduleExpression: !Ref SaturdayLineupSchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt LineupFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "saturday"}'

  SundayLineup:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-fantasy-lineup-sunday
      ScheduleExpression: !Ref SundayLineupSchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt LineupFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "sunday"}'

  AlertThursday:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-fantasy-lineup-alert-thursday
      ScheduleExpression: !Ref AlertThursdaySchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt LineupFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "alert"}'

  AlertSundayMorning:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-fantasy-lineup-alert-sunday-morning
      ScheduleExpression: !Ref AlertSundayMorningSchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt LineupFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "alert"}'

  # Logical IDs LateAlertSunday/LateAlertMonday predate the other alert names; renaming them would make
  # CloudFormation create the new schedule before deleting the old one, and the fixed Name would conflict.
  LateAlertSunday:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-fantasy-lineup-alert-sunday
      ScheduleExpression: !Ref AlertSundayAfternoonSchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt LineupFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "alert"}'

  AlertSundayNight:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-fantasy-lineup-alert-sunday-night
      ScheduleExpression: !Ref AlertSundayNightSchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt LineupFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "alert"}'

  LateAlertMonday:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-fantasy-lineup-alert-monday
      ScheduleExpression: !Ref AlertMondaySchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt LineupFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "alert"}'

  WaiverLineup:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-fantasy-lineup-waivers
      ScheduleExpression: !Ref WaiverSchedule
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt LineupFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"run": "waivers"}'

  # Checks a few hours after each expected run. If a run's time parameter moves, move these with it.
  PickemWatchdog:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-watchdog-pickem
      Description: Pick'em runs Thu 8:00 and Sun 6:00 CT; check at 10:00.
      ScheduleExpression: cron(0 10 ? * THU,SUN *)
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt WatchdogFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"function": "nfl-pickem", "max_age_hours": 5}'

  LineupWatchdog:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: nfl-watchdog-lineup
      Description: Lineup runs Tue 8:00, Thu 8:00, Sat 9:00 and Sun 10:45 CT; check at 12:30.
      ScheduleExpression: cron(30 12 ? * TUE,THU,SAT,SUN *)
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt WatchdogFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"function": "nfl-fantasy-lineup", "max_age_hours": 5}'

  # Plain-text "it failed" email through the Comed SNS topic, which doesn't depend on SES.
  LineupErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nfl-fantasy-lineup-errors
      AlarmDescription: The fantasy lineup run failed, so no lineup email went out. Check the nfl-fantasy-lineup logs; expired ESPN cookies are the usual cause.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LineupFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:ComedTopic

Outputs:
  FunctionName:
    Value: !Ref PickemFunction
  LineupFunctionName:
    Value: !Ref LineupFunction
