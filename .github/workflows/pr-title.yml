name: PR title

# PRs are squash-merged with the PR title as the commit title (the repo allows squash merges only),
# so checking the title keeps main in Conventional Commits form:
# https://www.conventionalcommits.org/en/v1.0.0/
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

# A newer push or title edit cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: "Check the title is 'type(scope)!: description'"
        env:
          TITLE: ${{ github.event.pull_request.title }}  # via env, never interpolated into the script
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: [^ ].*$'
          revert='^Revert ".+"$'  # GitHub's one-click revert PR title
          if printf '%s' "$TITLE" | grep -Eq -e "$pattern" -e "$revert"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add match notes' or 'fix(sync): handle missing WTN'. Got: $TITLE"
            exit 1
          fi
