AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Role that GitHub Actions assumes (OIDC, no stored keys) to deploy the nfl-pickem stack with ./deploy.sh.
  The scoping assumes the stack's roles are auto-named (FunctionRole, SchedulerRole in template.yaml): if you add a RoleName,
  rename one or add a third role, update the role patterns below first.
  Deployed once by hand, separately from the app stack so the stack can't delete its own deploy role:
  aws cloudformation deploy --region us-east-2 --stack-name nfl-pickem-deploy-role --template-file deploy-role.yaml --capabilities CAPABILITY_IAM --tags project=nfl-pickem

Parameters:
  GitHubSubject:
    Type: String
    # The repo uses GitHub's immutable subject claims (owner id / repo id), like TennisTracker.
    Default: repo:vinblue1977@13391763/NFL@1409543592:environment:production
    Description: OIDC subject allowed to assume the role. Only jobs in the repo's production environment (main only) match.
  GitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::235316001927:oidc-provider/token.actions.githubusercontent.com
    Description: The account's existing GitHub OIDC provider.

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions deploy role for the nfl-pickem stack
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProviderArn }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
      Policies:
        - PolicyName: deploy-nfl-pickem
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/nfl-pickem/*
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation, s3:CreateBucket, s3:PutBucketTagging, s3:GetBucketTagging]
                Resource: !Sub arn:${AWS::Partition}:s3:::nfl-pickem-artifacts-${AWS::AccountId}-${AWS::Region}
              - Sid: ArtifactObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::nfl-pickem-artifacts-${AWS::AccountId}-${AWS::Region}/*
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:nfl-*
              - Sid: Scheduler
                Effect: Allow
                Action: scheduler:*
                Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/nfl-*
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/nfl-*
              - Sid: LogGroupLookup
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: Alarms
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:TagResource, cloudwatch:UntagResource, cloudwatch:ListTagsForResource]
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:nfl-*
              - Sid: AlarmLookup
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: EmailIdentities
                Effect: Allow
                Action: [ses:CreateEmailIdentity, ses:DeleteEmailIdentity, ses:GetEmailIdentity, ses:PutEmailIdentityDkimAttributes, ses:PutEmailIdentityDkimSigningAttributes, ses:PutEmailIdentityFeedbackAttributes, ses:PutEmailIdentityMailFromAttributes, ses:PutEmailIdentityConfigurationSetAttributes, ses:TagResource, ses:UntagResource]
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
              # The stack's two roles are named nfl-pickem-FunctionRole-<suffix> and nfl-pickem-SchedulerRole-<suffix>.
              # The pattern deliberately excludes this deploy role, so it can't edit its own permissions or trust.
              - Sid: StackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/nfl-pickem-FunctionRole-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/nfl-pickem-SchedulerRole-*
              # Trust boundary: whatever is merged to main (the only branch the production environment accepts) is deployed,
              # including inline role policies, so this role is as trusted as write access to main. This statement just
              # stops a managed policy such as AdministratorAccess from being attached by accident.
              - Sid: AttachLoggingPolicyOnly
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/nfl-pickem-FunctionRole-*
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassStackRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/nfl-pickem-FunctionRole-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/nfl-pickem-SchedulerRole-*
                Condition:
                  StringEquals:
                    iam:PassedToService: [lambda.amazonaws.com, scheduler.amazonaws.com]

Outputs:
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN secret in the repo's production environment.
    Value: !GetAtt DeployRole.Arn
